<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Instagram Report Tool</title>

<style>
:root {
    --bg-color: #030305;
    --text-color: #ffffff;
    --subtext-color: #a1a1aa;
    --header-bg: #030305;
    --border-color: rgba(0, 243, 255, 0.2);
    --page1-bg: radial-gradient(circle at top, #120024 0%, #030305 70%);
    --container-bg: rgba(18, 18, 24, 0.85);
    --container-border: rgba(0, 243, 255, 0.3);
    --input-bg: rgba(10, 10, 15, 0.8);
    --input-border: rgba(0, 243, 255, 0.2);
    --input-text: #ffffff;
    --popup-bg: #121218;
    --popup-border: rgba(0, 243, 255, 0.2);
    --popup-text: #ffffff;
    --item-icon-bg: #121218;
    --item-icon-stroke: #00f3ff;
    --logo-bg: #ffffff;
}

body{
    background: var(--bg-color);
    color: var(--text-color);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin:0;
    font-size:14px;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
}

.page{
    display:none;
    height:100vh;
    width:100%;
    position:absolute;
    top:0;
    left:0;
    padding:0;
    box-sizing:border-box;
    overflow-y:auto;
}

.active{
    display:block;
}

.header{
    display:flex;
    align-items:center;
    padding:12px 16px;
    min-height:44px;
    border-bottom:1px solid var(--border-color);
    position:sticky;
    top:0;
    background: var(--header-bg);
    z-index:100;
    font-weight:600;
    cursor:pointer;
}

.back-arrow{
    font-size:30px;
    position:absolute;
    left:10px;
    color: #00f3ff;
    text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
}

.title{
    flex:1;
    text-align:center;
    font-size:18px;
    color: var(--text-color);
    text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
}

/* Page Center Wraps */
.page-center-wrap {
    background: var(--page1-bg);
    padding: 20px;
    padding-bottom: 90px;
    display: none;
    min-height: 100vh;
    box-sizing: border-box;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
.page-center-wrap.active {
    display: flex;
}

.container{
    background: var(--container-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 20px;
    border-radius: 24px;
    width: 100%;
    max-width: 360px;
    border: 1px solid var(--container-border);
    box-shadow: 0 0 25px rgba(0, 243, 255, 0.15), inset 0 0 15px rgba(0, 243, 255, 0.05);
    box-sizing: border-box;
}

.top-heading {
    text-align: center;
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 16px;
    color: #00f3ff;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
}

label{
    font-size: 11px;
    color: var(--subtext-color);
    font-weight: 700;
    display: block;
    margin-top: 10px;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
}

input, select{
    width: 100%;
    padding: 10px 12px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 12px;
    color: var(--input-text);
    box-sizing: border-box;
    font-size: 14px;
    outline: none;
    transition: all 0.3s ease;
}

input:focus, select:focus{
    border-color: #00f3ff;
    box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
}

button#submitBtn, .save-assets-btn{
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #00f3ff 0%, #0066ff 100%);
    border: none;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    margin-top: 18px;
    font-size: 15px;
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.save-assets-btn {
    background: linear-gradient(135deg, #ff007f 0%, #7a00ff 100%);
    box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    margin-top: 16px;
}

/* Neon Circles Layout for PFP & Logo */
.neon-circles-row {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin: 15px 0 5px 0;
}

.neon-circle-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
}

.neon-circle {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: rgba(18, 18, 24, 0.9);
    border: 2px dashed #00f3ff;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    overflow: hidden;
    transition: all 0.3s ease;
}

.neon-circle:hover {
    border-color: #ff007f;
    box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
}

.neon-circle .plus-badge {
    position: absolute;
    bottom: 2px;
    right: 2px;
    background: #00f3ff;
    color: #030305;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    font-size: 14px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 5px #00f3ff;
}

.neon-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0;
    left: 0;
}

.neon-circle-label {
    font-size: 11px;
    color: var(--subtext-color);
    margin-top: 6px;
    font-weight: 700;
    letter-spacing: 0.5px;
}

/* Bottom Dock Navigation */
.bottom-dock {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background: var(--header-bg);
    border-top: 1px solid var(--border-color);
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 1000;
    box-sizing: border-box;
    box-shadow: 0 -5px 20px rgba(0, 243, 255, 0.1);
}

.dock-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    cursor: pointer;
    color: var(--subtext-color);
    font-size: 11px;
    font-weight: 500;
    gap: 3px;
    transition: color 0.3s;
}

.dock-item.active, .dock-item:hover {
    color: #00f3ff;
    text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
}

/* Page Reports List (Normal Instagram Style Theme) */
#pageReports {
    display: none;
    flex-direction: column;
    height: 100vh;
    box-sizing: border-box;
    background: #000000;
    color: #f5f5f5;
}
#pageReports.active {
    display: flex;
}
#pageReports .header {
    background: #000000;
    border-bottom: 1px solid #262626;
    color: #f5f5f5;
}
#pageReports .back-arrow {
    color: #f5f5f5;
    text-shadow: none;
    font-size: 26px;
}
#pageReports .title {
    color: #f5f5f5;
    text-shadow: none;
    font-size: 16px;
    font-weight: 600;
}

/* Page 3 Structure (Normal Instagram Style Theme) */
#page3 {
    padding: 0 !important;
    display: none;
    flex-direction: column;
    height: 100vh;
    box-sizing: border-box;
    overflow: hidden;
    background: #000000;
    color: #f5f5f5;
}
#page3.active {
    display: flex;
}
#page3 .header {
    position: relative;
    padding: 12px 12px;
    min-height: 40px;
    border-bottom: 1px solid #262626;
    margin-bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: #000000;
}
.page3-back {
    position: absolute;
    left: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    z-index: 10;
    color: #f5f5f5;
}
#page3 .title {
    color: #f5f5f5;
    text-shadow: none;
    font-size: 16px;
    font-weight: 600;
}
.status-bar{
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    margin: 0;
    font-size: 13px;
    background: #00d911;
    color: #ffffff;
    text-shadow: none;
    flex-shrink: 0;
    box-shadow: none;
}
.circle-img{
    width: 55px;
    height: 55px;
    border-radius: 50%;
    margin-right: 14px;
    flex-shrink: 0;
    object-fit: cover;
    border: 1px solid #262626;
    box-shadow: none;
    box-sizing: border-box;
}
#logoContainer {
    width: 54px;
    height: 54px;
    background: var(--logo-bg);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
    border: 1px solid #262626;
    box-shadow: none;
    box-sizing: border-box;
}
.more-btn-container {
    padding: 0px 16px env(safe-area-inset-bottom, 16px) 16px;
    background: #000000;
    flex-shrink: 0;
}
.more-btn{
    background: #0095f6;
    color: #fff;
    padding: 13px;
    text-align: center;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    box-sizing: border-box;
    font-size: 14px;
    box-shadow: none;
}

/* POPUP OVERLAY (Original Normal Style) */
.popup-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.65);
    z-index: 1000;
    align-items: flex-end;
    justify-content: center;
    padding: 0 10px 12px 10px;
    box-sizing: border-box;
}
.popup-sheet {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: slideUp 0.25s ease-out;
}
@keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
}
.popup-group {
    background: #262626;
    border: none;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: none;
}
.popup-item {
    padding: 16px;
    text-align: center;
    font-size: 14px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
}
.popup-item.red-text {
    color: #ed4956;
    font-weight: 600;
    text-shadow: none;
}
.popup-item.normal-text {
    color: #f5f5f5;
    font-weight: 400;
}
.popup-item:not(:last-child) {
    border-bottom: 1px solid #363636;
}
.popup-cancel {
    background: #262626;
    border: none;
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: #f5f5f5;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    box-shadow: none;
}
</style>
</head>

<body>

<!-- PAGE 1: MAIN HOME PAGE -->
<div id="pageHome" class="page-center-wrap active">
<div class="container">
<div class="top-heading">

<script>
let liveTimerInterval = null;

window.onload = function() {
    loadSavedAssetsIntoPreviews();
    syncAllReportsWithGlobalAssets(false);
};

function previewAsset(input, previewId) {
    if (!input.files || !input.files[0]) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        const img = document.getElementById(previewId);
        img.src = e.target.result;
        img.style.display = 'block';
    };
    reader.readAsDataURL(input.files[0]);
}

function loadSavedAssetsIntoPreviews() {
    const savedPfp = localStorage.getItem('global_pfp');
    const savedLogo = localStorage.getItem('global_logo');

    if (savedPfp) {
        const pfpImg = document.getElementById('previewPfp');
        pfpImg.src = savedPfp;
        pfpImg.style.display = 'block';
    }

    if (savedLogo) {
        const logoImg = document.getElementById('previewLogo');
        logoImg.src = savedLogo;
        logoImg.style.display = 'block';
    }
}

function getSavedReports() {
    try {
        const reports = JSON.parse(localStorage.getItem('my_reports_final') || '[]');
        return Array.isArray(reports) ? reports : [];
    } catch (e) {
        return [];
    }
}

function syncAllReportsWithGlobalAssets(showMessage) {
    const currentPfp = localStorage.getItem('global_pfp') || '';
    const currentLogo = localStorage.getItem('global_logo') || '';
    let reports = getSavedReports();

    if (reports.length) {
        reports = reports.map(function(rep) {
            rep.pfp = currentPfp;
            rep.logo = currentLogo;
            return rep;
        });
        localStorage.setItem('my_reports_final', JSON.stringify(reports));
    }

    if (showMessage) {
        alert('Assets saved & synced with all reports successfully!');
    }
}

function parseCustomTime(timeStr) {
    if(!timeStr) return 60;
    timeStr = timeStr.trim().toLowerCase();
    const num = parseInt(timeStr);
    if(isNaN(num)) return timeStr;

    if(timeStr.includes('h')) return num * 3600;
    if(timeStr.includes('d')) return num * 86400;
    if(timeStr.includes('m')) return num * 60;
    return num * 60;
}

function formatElapsedTime(timeVal) {
    if(typeof timeVal === 'string' &&
       !timeVal.endsWith('m') &&
       !timeVal.endsWith('h') &&
       !timeVal.endsWith('d')) {
        return timeVal;
    }

    const totalSeconds = typeof timeVal === 'number'
        ? timeVal
        : parseCustomTime(String(timeVal));

    if(isNaN(totalSeconds)) return timeVal;

    if(totalSeconds >= 7 * 86400) {
        const options = { day: 'numeric', month: 'long' };
        return new Date(Date.now() - totalSeconds * 1000)
            .toLocaleDateString('en-US', options);
    }

    if(totalSeconds < 3600) {
        const m = Math.floor(totalSeconds / 60);
        return Math.max(1, m) + 'm';
    }

    if(totalSeconds < 86400) {
        const h = Math.floor(totalSeconds / 3600);
        return h + 'h';
    }

    const d = Math.floor(totalSeconds / 86400);
    return d + 'd';
}

function showPage(id){
    if (liveTimerInterval) {
        clearInterval(liveTimerInterval);
        liveTimerInterval = null;
    }

    const pageIdMap = {
        'pageHome': 'pageHome',
        'pageMenu': 'pageMenu',
        'pageReports': 'pageReports'
    };

    const targetId = pageIdMap[id] || id;

    if(targetId === 'pageReports') {
        updateStoredTimes();
        syncAllReportsWithGlobalAssets(false);
        const reports = getSavedReports();
        renderList(reports);
    }

    document.querySelectorAll('.page-center-wrap, #pageReports, #page3')
        .forEach(function(p) {
            p.classList.remove('active');
        });

    const targetEl = document.getElementById(targetId);
    if(targetEl) targetEl.classList.add('active');

    const dock = document.getElementById('bottomDock');
    document.querySelectorAll('.dock-item')
        .forEach(function(item) {
            item.classList.remove('active');
        });

    if(targetId === 'pageHome') {
        document.getElementById('dockHome').classList.add('active');
        dock.style.display = 'flex';
    } else if(targetId === 'pageMenu') {
        document.getElementById('dockMenu').classList.add('active');
        dock.style.display = 'flex';
    } else {
        dock.style.display = 'none';
    }
}

function saveAssetsSync() {
    const pfpFile = document.getElementById('pfpInput').files[0];
    const logoFile = document.getElementById('logoInput').files[0];

    const applySync = function(pfpUrl, logoUrl) {
        if(pfpUrl !== null) {
            localStorage.setItem('global_pfp', pfpUrl);
        }

        if(logoUrl !== null) {
            localStorage.setItem('global_logo', logoUrl);
        }

        syncAllReportsWithGlobalAssets(true);
    };

    if (pfpFile) {
        const readerPfp = new FileReader();

        readerPfp.onload = function(e1) {
            const pfpUrl = e1.target.result;

            if (logoFile) {
                const readerLogo = new FileReader();

                readerLogo.onload = function(e2) {
                    applySync(pfpUrl, e2.target.result);
                };

                readerLogo.readAsDataURL(logoFile);
            } else {
                applySync(pfpUrl, null);
            }
        };

        readerPfp.readAsDataURL(pfpFile);

    } else if (logoFile) {
        const readerLogo = new FileReader();

        readerLogo.onload = function(e2) {
            applySync(null, e2.target.result);
        };

        readerLogo.readAsDataURL(logoFile);

    } else {
        // Nothing new selected: keep existing saved assets and just sync them.
        syncAllReportsWithGlobalAssets(true);
    }
}

function updateStoredTimes() {
    let reports = getSavedReports();
    const now = Math.floor(Date.now() / 1000);

    reports = reports.map(function(rep) {
        if(!rep.createdAt) rep.createdAt = now;

        const elapsed = now - rep.createdAt;

        if(typeof rep.reportBaseSec === 'number') {
            rep.time = formatElapsedTime(rep.reportBaseSec + elapsed);
        }

        if(typeof rep.supportBaseSec === 'number') {
            rep.supportTime = formatElapsedTime(rep.supportBaseSec + elapsed);
        }

        return rep;
    });

    localStorage.setItem('my_reports_final', JSON.stringify(reports));
}

function saveAndGo(){
    const user = document.getElementById('username').value.trim() || 'username';
    const reason = document.getElementById('reason').value;
    const rawReportTime =
        document.getElementById('reportTimeInput').value.trim() || '1m';
    const rawSupportTime =
        document.getElementById('supportTimeInput').value.trim() || '1m';

    const now = Math.floor(Date.now() / 1000);

    const reportSec = parseCustomTime(rawReportTime);
    const supportSec = parseCustomTime(rawSupportTime);

    const pfpUrl = localStorage.getItem('global_pfp') || '';
    const logoUrl = localStorage.getItem('global_logo') || '';

    const newReport = {
        user: user,
        reason: reason,
        rawReportTime: rawReportTime,
        rawSupportTime: rawSupportTime,
        createdAt: now,
        reportBaseSec: typeof reportSec === 'number' ? reportSec : 60,
        supportBaseSec: typeof supportSec === 'number' ? supportSec : 60,
        time: formatElapsedTime(reportSec),
        supportTime: formatElapsedTime(supportSec),
        pfp: pfpUrl,
        logo: logoUrl
    };

    const reports = getSavedReports();
    reports.unshift(newReport);

    localStorage.setItem('my_reports_final', JSON.stringify(reports));

    // Keep the original navigation flow intact.
    showPage('pageReports');
}

function renderList(reports){
    const listContainer = document.getElementById('report-list');
    listContainer.innerHTML = '';

    reports.forEach(function(data, index){
        listContainer.innerHTML += `
        <div class="header" style="border:none;border-bottom:1px solid #262626;padding:15px 16px;cursor:pointer;background:#000000;" onclick="viewReport(${index})">
            <div style="display:flex;align-items:flex-start;width:100%;">
                <div style="width:44px;height:44px;background:#262626;border-radius:8px;margin-right:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:none;">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="8" r="4" stroke="#a1a1aa" stroke-width="2"/>
                    <path d="M4 20C5.5 16.5 8.5 15 12 15C15.5 15 18.5 16.5 20 20" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <div style="flex:1;">
                    <div style="color:#a1a1aa;font-size:11.5px;margin-bottom:4px;">
                        Reviewed • ${data.time}
                    </div>
                    <div style="font-size:13.5px;color:#f5f5f5;">You anonymously reported ${data.user} for ${data.reason}.</div>
                </div>
            </div>
        </div>`;
    });
}

function viewReport(index){
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    let reports = getSavedReports();

    // Current global assets are always used for every report.
    const currentPfp = localStorage.getItem('global_pfp') || '';
    const currentLogo = localStorage.getItem('global_logo') || '';

    reports = reports.map(function(rep) {
        rep.pfp = currentPfp;
        rep.logo = currentLogo;
        return rep;
    });

    localStorage.setItem('my_reports_final', JSON.stringify(reports));

    const data = reports[index];

    if(data) {
        const updateDynamicTimes = function() {
            const now = Math.floor(Date.now() / 1000);

            if(!data.createdAt) data.createdAt = now;

            const elapsed = now - data.createdAt;

            let currentReportTime = data.time;
            let currentSupportTime = data.supportTime;

            if(typeof data.reportBaseSec === 'number') {
                currentReportTime =
                    formatElapsedTime(data.reportBaseSec + elapsed);
            }

            if(typeof data.supportBaseSec === 'number') {
                currentSupportTime =
                    formatElapsedTime(data.supportBaseSec + elapsed);
            }

            document.getElementById('disp-time').innerText = currentReportTime;
            document.getElementById('disp-time-bottom').innerText =
                currentSupportTime;
        };

        updateDynamicTimes();
        liveTimerInterval = setInterval(updateDynamicTimes, 1000);

        document.getElementById('disp-pfp').src = data.pfp || '';
        document.getElementById('disp-user').innerText =
            data.user + "'s account";
        document.getElementById('disp-reason').innerText = data.reason;

        const logoContainer = document.getElementById('logoContainer');
        const defaultIgIcon = document.getElementById('defaultIgIcon');
        const customLogoImg = document.getElementById('customLogoImg');

        if(data.logo) {
            logoContainer.style.background = 'transparent';
            defaultIgIcon.style.display = 'none';
            customLogoImg.src = data.logo;
            customLogoImg.style.display = 'block';
        } else {
            logoContainer.style.background = '#ffffff';
            defaultIgIcon.style.display = 'block';
            customLogoImg.style.display = 'none';
        }

        document.getElementById('disp-title-text').innerText =
            `We've removed ${data.user}'s account because it goes against our Community Standards.`;
        document.getElementById('disp-msg-p1').innerText =
            `Thank you for reporting this account. We've removed it from Instagram because it goes against our CommunityStandards.`;
        document.getElementById('disp-msg-p2').innerText =
            `Reports like yours are an important part of making Instagram a safe and welcoming place for everyone.`;

        document.getElementById('pop-block').innerText = `Block ${data.user}`;
        document.getElementById('pop-restrict').innerText = `Restrict ${data.user}`;

        showPage('page3');
    }
}

function openPopup() {
    document.getElementById('popupOverlay').style.display = 'flex';
}

function closePopup(e) {
    if(e.target.id === 'popupOverlay') {
        document.getElementById('popupOverlay').style.display = 'none';
    }
}

function closePopupForce() {
    document.getElementById('popupOverlay').style.display = 'none';
}
</script>
