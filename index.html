<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Instagram Report Tool</title>

<style>
/* CSS Variables for Auto Appearance System */
:root {
    --bg-color: #000000;
    --text-color: #f5f5f7;
    --subtext-color: #8e8e93;
    --header-bg: #000000;
    --border-color: #262626;
    --page1-bg: radial-gradient(circle at top, #1c1c1e 0%, #000000 70%);
    --container-bg: rgba(28, 28, 30, 0.75);
    --container-border: rgba(255, 255, 255, 0.1);
    --input-bg: rgba(44, 44, 46, 0.6);
    --input-border: rgba(255, 255, 255, 0.08);
    --input-text: #ffffff;
    --popup-bg: #262626;
    --popup-border: #363636;
    --popup-text: #ffffff;
    --item-icon-bg: #1c1c1e;
    --item-icon-stroke: #E5E5E5;
    --logo-bg: #ffffff;
}

@media (prefers-color-scheme: light) {
    :root {
        --bg-color: #ffffff;
        --text-color: #000000;
        --subtext-color: #636366;
        --header-bg: #ffffff;
        --border-color: #dbdbdb;
        --page1-bg: radial-gradient(circle at top, #f2f2f7 0%, #ffffff 70%);
        --container-bg: rgba(242, 242, 247, 0.85);
        --container-border: rgba(0, 0, 0, 0.1);
        --input-bg: rgba(230, 230, 238, 0.8);
        --input-border: rgba(0, 0, 0, 0.1);
        --input-text: #000000;
        --popup-bg: #e5e5ea;
        --popup-border: #d1d1d6;
        --popup-text: #000000;
        --item-icon-bg: #e5e5ea;
        --item-icon-stroke: #333333;
        --logo-bg: #f2f2f7;
    }
}

body{
    background: var(--bg-color);
    color: var(--text-color);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin:0;
    font-size:14px;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
}

.page{
    display:none;
    height:100vh;
    width:100%;
    position:absolute;
    top:0;
    left:0;
    padding:0;
    box-sizing:border-box;
    overflow-y:auto;
}

.active{
    display:block;
}

/* Top Header */
.header{
    display:flex;
    align-items:center;
    padding:12px 16px;
    min-height:44px;
    border-bottom:1px solid var(--border-color);
    position:sticky;
    top:0;
    background: var(--header-bg);
    z-index:100;
    font-weight:600;
    cursor:pointer;
}

.back-arrow{
    font-size:30px;
    position:absolute;
    left:10px;
    color: var(--text-color);
}

.title{
    flex:1;
    text-align:center;
    font-size:16px;
    color: var(--text-color);
}

/* Page 1 Style */
#page1 {
    background: var(--page1-bg);
    padding: 20px;
    display: none;
}
#page1.active {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.container{
    background: var(--container-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 20px;
    border-radius: 24px;
    width: 100%;
    max-width: 360px;
    border: 1px solid var(--container-border);
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    box-sizing: border-box;
}

.top-heading {
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    color: var(--text-color);
    letter-spacing: 0.5px;
}

label{
    font-size: 11px;
    color: var(--subtext-color);
    font-weight: 700;
    display: block;
    margin-top: 10px;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
}

input, select{
    width: 100%;
    padding: 10px 12px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 12px;
    color: var(--input-text);
    box-sizing: border-box;
    font-size: 14px;
    outline: none;
    transition: all 0.3s ease;
}

input:focus, select:focus{
    border-color: #0095F6;
}

button#submitBtn{
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #0095F6 0%, #0064e0 100%);
    border: none;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    margin-top: 18px;
    font-size: 15px;
    box-shadow: 0 8px 20px rgba(0, 149, 246, 0.3);
}

/* Page 3 Structure */
#page3 {
    padding: 0 !important;
    display: none;
    flex-direction: column;
    height: 100vh;
    box-sizing: border-box;
    overflow: hidden;
    background: var(--bg-color);
}

#page3.active {
    display: flex;
}

#page3 .header {
    position: relative;
    padding: 12px 16px;
    min-height: 40px;
    border-bottom: none;
    margin-bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.page3-back {
    position: absolute;
    left: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    z-index: 10;
    color: var(--text-color);
}

/* 3rd Page Closed Status Bar */
.status-bar{
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    color: #fff;
    margin: 0;
    font-size: 13px;
    background: #00D911;
    flex-shrink: 0;
}

.circle-img{
    width: 55px;
    height: 55px;
    border-radius: 50%;
    margin-right: 14px;
    flex-shrink: 0;
    object-fit: cover;
    border: 1px solid var(--border-color);
    box-sizing: border-box;
}

#logoContainer {
    width: 54px;
    height: 54px;
    background: var(--logo-bg);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
    border: 1px solid var(--border-color);
    box-sizing: border-box;
}

.more-btn-container {
    padding: 12px 16px env(safe-area-inset-bottom, 16px) 16px;
    background: var(--bg-color);
    flex-shrink: 0;
}

.more-btn{
    background: #0095F6;
    color: #fff;
    padding: 13px;
    text-align: center;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    box-sizing: border-box;
    font-size: 15px;
}

/* POPUP OVERLAY */
.popup-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.65);
    z-index: 1000;
    align-items: flex-end;
    justify-content: center;
    padding: 0 10px 12px 10px;
    box-sizing: border-box;
}
.popup-sheet {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: slideUp 0.25s ease-out;
}
@keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
}
.popup-group {
    background: var(--popup-bg);
    border-radius: 14px;
    overflow: hidden;
}
.popup-item {
    padding: 16px;
    text-align: center;
    font-size: 15px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
}
.popup-item.red-text {
    color: #ed4956;
    font-weight: 500;
}
.popup-item.normal-text {
    color: var(--popup-text);
    font-weight: 400;
}
.popup-item:not(:last-child) {
    border-bottom: 1px solid var(--popup-border);
}
.popup-cancel {
    background: var(--popup-bg);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--popup-text);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="page active">
<div class="container">
<div class="top-heading">
    OG NOTI MAKER
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM17.44 8.18L15.61 16.84C15.46 17.51 15.05 17.68 14.48 17.41L11.74 15.37L10.42 16.63C10.27 16.78 10.15 16.9 9.87 16.9L10.07 14.12L15.06 9.61C15.28 9.42 15.01 9.31 14.72 9.5L8.53 13.34L5.86 12.51C5.28 12.33 5.27 11.93 5.99 11.65L16.71 7.47C17.21 7.29 17.63 7.57 17.44 8.18Z" fill="#24A1DE"/>
    </svg>
</div>

<label>Target Username</label>
<input type="text" id="username" placeholder="username">

<label>Report Reason</label>
<select id="reason">
<option>spam</option>
<option>hate speech or symbol</option>
<option>impersonation</option>
<option>underage</option>
<option>bullying and harassment</option>
<option>violence or dangerous organisation</option>
<option>nudity or sexual activity</option>
<option>scam and fraud</option>
<option>drugs</option>
<option>suicide or self-injury</option>
</select>

<label>Report Time Offset (e.g. 7m, 4h, 2d)</label>
<input type="text" id="reportTimeInput" placeholder="7m, 2h, 1d">

<label>Support Time Offset (e.g. 10m, 5h, 2d)</label>
<input type="text" id="supportTimeInput" placeholder="10m, 5h, 2d">

<label>My Profile Picture</label>
<input type="file" id="pfpInput" accept="image/*">

<label>Custom Logo Image (Optional)</label>
<input type="file" id="logoInput" accept="image/*">

<button id="submitBtn" type="button" onclick="saveAndGo()">GET NOTI</button>
</div>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
<div class="header" onclick="showPage('page1')">
<span class="back-arrow">‹</span>
<span class="title">Reports</span>
</div>
<div id="report-list"></div>
</div>

<!-- PAGE 3 -->
<div id="page3" class="page">
<div class="header">
<div class="page3-back" onclick="showPage('page2')">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
</div>
<div class="title">Report</div>
</div>

<div id="status-bar" class="status-bar">Closed</div>

<!-- Middle Content Area -->
<div style="padding: 16px; flex: 1; overflow-y: auto; display: flex; flex-direction: column;">

<!-- Top Section: User reported row -->
<div style="display:flex; align-items:center; margin-bottom:16px;">
<img id="disp-pfp" class="circle-img" style="background:var(--item-icon-bg);">
<div style="font-size: 13.5px; line-height: 1.4;">
You anonymously reported <span id="disp-user"></span> for <span id="disp-reason"></span>.<br>
<span id="disp-time" style="color:var(--subtext-color); font-size:12px;"></span>
</div>
</div>

<div style="border-bottom:1px solid var(--border-color); margin-bottom:18px;"></div>

<!-- Main Section: Logo on Left -->
<div style="display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px;">
    
    <!-- Left Column: Circle Logo -->
    <div id="logoContainer">
        <svg id="defaultIgIcon" width="36" height="36" viewBox="0 0 24 24" fill="none">
            <defs>
                <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#f09433"/>
                    <stop offset="25%" stop-color="#e6683c"/>
                    <stop offset="50%" stop-color="#dc2743"/>
                    <stop offset="75%" stop-color="#cc2366"/>
                    <stop offset="100%" stop-color="#bc1888"/>
                </linearGradient>
            </defs>
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke="url(#igGrad)" stroke-width="2"/>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" stroke="url(#igGrad)" stroke-width="2"/>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" stroke="url(#igGrad)" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <img id="customLogoImg" style="width:100%; height:100%; object-fit:cover; display:none;">
    </div>

    <!-- Right Column -->
    <div style="flex: 1; display: flex; flex-direction: column; padding-top: 15px;">
        <div id="disp-title-text" style="font-size: 13.5px; font-weight: 600; color: var(--text-color); line-height: 1.32; margin-bottom: 14px;"></div>
        <div id="disp-msg-p1" style="font-size: 13.5px; color: var(--text-color); line-height: 1.35; margin-bottom: 14px;"></div>
        <div id="disp-msg-p2" style="font-size: 13.5px; color: var(--text-color); line-height: 1.35; margin-bottom: 4px;"></div>
        <div id="disp-time-bottom" style="color: var(--subtext-color); font-size: 12px;"></div>
    </div>

</div>

<div style="border-bottom:1px solid var(--border-color); margin-top: auto; padding-bottom: 12px;"></div>
</div>

<!-- Bottom Blue More Options Button -->
<div class="more-btn-container">
    <div class="more-btn" onclick="openPopup()">More Options</div>
</div>
</div>

<!-- POPUP OVERLAY -->
<div id="popupOverlay" class="popup-overlay" onclick="closePopup(event)">
    <div class="popup-sheet">
        <div class="popup-group">
            <div id="pop-block" class="popup-item red-text" onclick="alert('Action simulated!')"></div>
            <div id="pop-restrict" class="popup-item red-text" onclick="alert('Action simulated!')"></div>
            <div class="popup-item normal-text" onclick="alert('Opening Community Guidelines...')">See Community Guidelines</div>
        </div>
        <div class="popup-cancel" onclick="closePopupForce()">Cancel</div>
    </div>
</div>

<script>
let liveTimerInterval = null;

function parseCustomTime(timeStr) {
    if(!timeStr) return 60;
    timeStr = timeStr.trim().toLowerCase();
    const num = parseInt(timeStr);
    if(isNaN(num)) return timeStr; // Fallback text if user types non-numeric date
    
    if(timeStr.includes('h')) return num * 3600;
    if(timeStr.includes('d')) return num * 86400;
    if(timeStr.includes('m')) return num * 60;
    return num * 60; // Default to minutes
}

function formatElapsedTime(timeVal) {
    if(typeof timeVal === 'string' && !timeVal.endsWith('m') && !timeVal.endsWith('h') && !timeVal.endsWith('d')) {
        return timeVal;
    }
    const totalSeconds = typeof timeVal === 'number' ? timeVal : parseCustomTime(String(timeVal));
    if(isNaN(totalSeconds)) return timeVal;

    if(totalSeconds >= 7 * 86400) {
        const options = { day: 'numeric', month: 'long' };
        return new Date(Date.now() - totalSeconds * 1000).toLocaleDateString('en-US', options);
    }
    if(totalSeconds < 3600) {
        const m = Math.floor(totalSeconds / 60);
        return Math.max(1, m) + 'm';
    }
    if(totalSeconds < 86400) {
        const h = Math.floor(totalSeconds / 3600);
        return h + 'h';
    }
    const d = Math.floor(totalSeconds / 86400);
    return d + 'd';
}

function showPage(id){
    if (liveTimerInterval) {
        clearInterval(liveTimerInterval);
        liveTimerInterval = null;
    }
    if(id === 'page2') {
        updateStoredTimes();
        const reports = JSON.parse(localStorage.getItem('my_reports_final') || '[]');
        renderList(reports);
    }
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function updateStoredTimes() {
    let reports = JSON.parse(localStorage.getItem('my_reports_final') || '[]');
    const now = Math.floor(Date.now() / 1000);
    reports = reports.map(rep => {
        if(!rep.createdAt) rep.createdAt = now;
        const elapsed = now - rep.createdAt;
        
        if(typeof rep.reportBaseSec === 'number') {
            rep.time = formatElapsedTime(rep.reportBaseSec + elapsed);
        }
        if(typeof rep.supportBaseSec === 'number') {
            rep.supportTime = formatElapsedTime(rep.supportBaseSec + elapsed);
        }
        return rep;
    });
    localStorage.setItem('my_reports_final', JSON.stringify(reports));
}

function saveAndGo(){
    const user = document.getElementById('username').value.trim() || 'username';
    const reason = document.getElementById('reason').value;
    const rawReportTime = document.getElementById('reportTimeInput').value.trim() || '1m';
    const rawSupportTime = document.getElementById('supportTimeInput').value.trim() || '1m';
    const pfpFile = document.getElementById('pfpInput').files[0];
    const logoFile = document.getElementById('logoInput').files[0];
    const now = Math.floor(Date.now() / 1000);

    const processSave = (pfpUrl, logoUrl) => {
        const reportSec = parseCustomTime(rawReportTime);
        const supportSec = parseCustomTime(rawSupportTime);
        const newReport = {
            user, 
            reason, 
            rawReportTime,
            rawSupportTime,
            createdAt: now,
            reportBaseSec: typeof reportSec === 'number' ? reportSec : 60,
            supportBaseSec: typeof supportSec === 'number' ? supportSec : 60,
            time: formatElapsedTime(rawReportTime), 
            supportTime: formatElapsedTime(rawSupportTime), 
            pfp: pfpUrl || '', 
            logo: logoUrl || ''
        };
        
        let reports = JSON.parse(localStorage.getItem('my_reports_final') || '[]');
        reports.unshift(newReport);
        localStorage.setItem('my_reports_final', JSON.stringify(reports));
        
        showPage('page2');
    };

    if (pfpFile) {
        const readerPfp = new FileReader();
        readerPfp.onload = function(e1) {
            const pfpUrl = e1.target.result;
            if (logoFile) {
                const readerLogo = new FileReader();
                readerLogo.onload = function(e2) { processSave(pfpUrl, e2.target.result); };
                readerLogo.onerror = function() { processSave(pfpUrl, ''); };
                readerLogo.readAsDataURL(logoFile);
            } else {
                processSave(pfpUrl, '');
            }
        };
        readerPfp.readAsDataURL(pfpFile);
    } else if (logoFile) {
        const readerLogo = new FileReader();
        readerLogo.onload = function(e2) { processSave('', e2.target.result); };
        readerLogo.readAsDataURL(logoFile);
    } else {
        processSave('', '');
    }
}

function renderList(reports){
    const list = document.getElementById('report-list');
    list.innerHTML = '';
    reports.forEach((data, index)=>{
        list.innerHTML += `
        <div class="header" style="border:none;border-bottom:1px solid var(--border-color);padding:15px 16px;cursor:pointer;background:var(--bg-color);" onclick="viewReport(${index})">
            <div style="display:flex;align-items:flex-start;width:100%;">
                <div style="width:44px;height:44px;background:var(--item-icon-bg);border-radius:8px;margin-right:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-color);">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="8" r="4" stroke="var(--item-icon-stroke)" stroke-width="2"/>
                    <path d="M4 20C5.5 16.5 8.5 15 12 15C15.5 15 18.5 16.5 20 20" stroke="var(--item-icon-stroke)" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <div style="flex:1;">
                    <div style="color:var(--subtext-color);font-size:11.5px;margin-bottom:4px;">
                        Reviewed • ${data.time}
                    </div>
                    <div style="font-size:13.5px;color:var(--text-color);">You anonymously reported ${data.user} for ${data.reason}.</div>
                </div>
            </div>
        </div>`;
    });
}

function viewReport(index){
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    let reports = JSON.parse(localStorage.getItem('my_reports_final') || '[]');
    const data = reports[index];
    
    if(data) {
        const updateDynamicTimes = () => {
            const now = Math.floor(Date.now() / 1000);
            if(!data.createdAt) data.createdAt = now;
            const elapsed = now - data.createdAt;

            let currentReportTime = data.time;
            let currentSupportTime = data.supportTime;

            if(typeof data.reportBaseSec === 'number') {
                currentReportTime = formatElapsedTime(data.reportBaseSec + elapsed);
            }
            if(typeof data.supportBaseSec === 'number') {
                currentSupportTime = formatElapsedTime(data.supportBaseSec + elapsed);
            }

            document.getElementById('disp-time').innerText = currentReportTime;
            document.getElementById('disp-time-bottom').innerText = currentSupportTime;
        };

        updateDynamicTimes();
        liveTimerInterval = setInterval(updateDynamicTimes, 1000);

        document.getElementById('disp-pfp').src = data.pfp || '';
        document.getElementById('disp-user').innerText = data.user + "'s account";
        document.getElementById('disp-reason').innerText = data.reason;

        const logoContainer = document.getElementById('logoContainer');
        const defaultIgIcon = document.getElementById('defaultIgIcon');
        const customLogoImg = document.getElementById('customLogoImg');

        if(data.logo) {
            logoContainer.style.background = 'transparent';
            defaultIgIcon.style.display = 'none';
            customLogoImg.src = data.logo;
            customLogoImg.style.display = 'block';
        } else {
            logoContainer.style.background = 'var(--logo-bg)';
            defaultIgIcon.style.display = 'block';
            customLogoImg.style.display = 'none';
        }

        document.getElementById('disp-title-text').innerText = `We've removed ${data.user}'s account because it goes against our Community Standards.`;
        document.getElementById('disp-msg-p1').innerText = `Thank you for reporting this account. We've removed it from Instagram because it goes against our Community Standards.`;
        document.getElementById('disp-msg-p2').innerText = `Reports like yours are an important part of making Instagram a safe and welcoming place for everyone.`;

        document.getElementById('pop-block').innerText = `Block ${data.user}`;
        document.getElementById('pop-restrict').innerText = `Restrict ${data.user}`;

        showPage('page3');
    }
}

function openPopup() {
    document.getElementById('popupOverlay').style.display = 'flex';
}

function closePopup(e) {
    if(e.target.id === 'popupOverlay') {
        document.getElementById('popupOverlay').style.display = 'none';
    }
}

function closePopupForce() {
    document.getElementById('popupOverlay').style.display = 'none';
}
</script>
</body>
</html>
